local:
  venv: /home/ubuntu/apps/home.venv

http:
  upload_file_types: [".txt", ".pdf", ".docx", "pptx"]

llm_models:
- provider: alibaba
  model: qwen-plus
  api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key: sk-xxxxxxxx
  hosted_vllm: true

- provider: ollama
  model: deepseek-r1:8b
  api_base: http://localhost:11434
  api_key: ""

- provider: deepseek
  model: deepseek-chat
  api_base: https://api.deepseek.com
  api_key: sk-xxxxxxxx

embedding:
  provider: ollama
  model: bge-m3:567m
  api_base: http://localhost:11434

  alibaba:
    provider: alibaba
    model: text-embedding-v4
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: sk-xxxxxxxx
    hosted_vllm: true

qdrant:
  addr: http://ali-s01-sh.lan:6333
  # collection_name: auto-generated(f"{privider}__{model.replace(':', '--')}")
  top_n: 10

reranker:
  model: data/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2.model
  top_n: 5

system_prompt: |
  你是公司技术支持团队的 AI 助手，帮助员工快速找到开发文档、产品说明和操作流程中的关键信息。

  回答应简明、准确，并尽可能引用上下文中的术语或内容。

user_prompt: |
  请根据以下 Input（用户问题）和 Context（提供的资料）进行回答：

  Input: {input}

  Context:
  {context}

  回答时请使用简洁明了的语言，你只能基于提供的上下文内容回答问题，如上下文中未包含足够信息，请直接说明“没有找到相关资料”。
