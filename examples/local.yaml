# path: configs/local.yaml

local:
  venv: /home/ubuntu/apps/home.venv

http:
  upload_file_types: [".txt", ".pdf", ".md", ".epub", ".docx", "pptx", "odt", "odp"]

llm_models:
- provider: alibaba
  model: qwen-plus
  api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key: sk-xxxxxxxx
  hosted_vllm: true

- provider: deepseek
  model: deepseek-chat
  api_base: https://api.deepseek.com
  api_key: sk-xxxxxxxx

- provider: ollama
  model: deepseek-r1:8b
  api_base: http://localhost:11434

embedding:
  provider: ollama
  model: bge-m3:567m
  api_base: http://localhost:11434

  # provider: alibaba
  # model: text-embedding-v4
  # api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
  # api_key: sk-xxxxxxxx
  # hosted_vllm: true

qdrant:
  addr: http://ali-s01-sh.lan:6333
  # collection_name: auto-generated(f"{privider}__{model.replace(':', '--')}")
  top_n: 5
  score_threshold: 0.5

reranker:
  model: data/models/BAAI/bge-reranker-base.model
